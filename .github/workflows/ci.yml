name: CI
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - "**"

jobs: 
  check-lock-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for wrong lock files
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "⌈ package-lock.json is tracked! This project uses pnpm exclusively."
            exit 1
          fi
          if git ls-files --error-unmatch yarn.lock >/dev/null 2>&1; then
            echo "⌈ yarn.lock is tracked! This project uses pnpm exclusively."
            exit 1
          fi
          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "⌈ pnpm-loce.yaml not found! Lock file is required."
            exit 1
          fi
          echo "⌈ Lock file validation passed"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check-lock-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@~4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          retention-days: 30

  build-and-test:
    runs-on: ubuntu-latest
    needs: check-lock-files
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@~4
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Validate environment variables
        run: node scripts/validate-env.js
      
      - name: Validate locale catalogs
        run: pnpm validate:i18n
      
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test components
        run: pnpm test:components
      
      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
      
      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.run_id }}-${{ github.run_attempt }}
          path: storybook-static
          retention-days: 30

      - name: Test with coverage
        run: pnpm test:coverage
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          retention-days: 30

  visual-regression:
    runs-on: ubuntu-latest
    needs: check-lock-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@~4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Pin the rendering environment so font availability matches the
      # committed baselines. Baselines are generated and verified on this
      # exact image; running `test:visual:update` on a different OS/font set
      # is the usual source of environment-driven false diffs.
      - name: Install pinned fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation \
            fonts-noto-color-emoji

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Runs against the committed baselines in app/visual-tests/.
      # A failure here means either a real visual change or a baseline that
      # was updated without review — see CONTRIBUTING for the update workflow.
      - name: Visual regression tests
        run: pnpm test:visual

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
